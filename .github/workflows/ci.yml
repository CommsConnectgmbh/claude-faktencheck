name: CI
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
      - name: Install into a scratch dir and uninstall again
        run: |
          export CLAUDE_DIR="$RUNNER_TEMP/claude"
          ./install.sh --yes
          test -x "$CLAUDE_DIR/hooks/faktencheck/paket-check.py"
          python -c "import json,os; d=json.load(open(os.environ['CLAUDE_DIR']+'/settings.json')); assert 'Stop' in d['hooks'] and 'PreToolUse' in d['hooks']"
          ./install.sh --uninstall
          test ! -e "$CLAUDE_DIR/skills/faktencheck"
      - name: Plugin manifests are consistent
        run: |
          python - <<'PY'
          import json
          plugin = json.load(open(".claude-plugin/plugin.json"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          hooks = json.load(open("hooks/hooks.json"))["hooks"]
          assert plugin["name"] in [p["name"] for p in market["plugins"]]
          assert set(hooks) == {"PreToolUse", "Stop"}
          for event in hooks.values():
              for group in event:
                  for h in group["hooks"]:
                      path = h["command"].split('"')[1].replace("${CLAUDE_PLUGIN_ROOT}/", "")
                      open(path).close()
          print("ok", plugin["name"], plugin["version"])
          PY
